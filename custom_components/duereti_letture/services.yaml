recupera_ticket:
  name: Recupera un ticket
  description: >-
    Riprende un ticket Duereti già esistente, saltando la chiamata
    requestExport. Utile quando si è ottenuto un ticket per altre vie (es. una
    chiamata manuale con curl/Bruno) o quando l'integrazione ne aveva perso
    uno ancora valido: evita di chiedere un nuovo export, che è la chiamata
    bloccata più spesso dal WAF di Duereti. Se c'è già un recupero in corso
    viene annullato (il suo ticket resta annotato nei log).
  fields:
    ticket:
      name: Ticket
      description: L'identificativo restituito da requestExport.
      required: true
      example: ENdZS6CausBMlUzrS3as5Q
      selector:
        text:
    data_da:
      name: Data inizio
      description: >-
        Inizio del periodo coperto dal ticket. Solo un'etichetta per i sensori
        diagnostici, non influenza i dati importati (che arrivano interamente
        dal file). Se omessa si assume il primo giorno del mese precedente.
      required: false
      example: "2026-07-01"
      selector:
        date:
    data_a:
      name: Data fine
      description: >-
        Fine del periodo coperto dal ticket. Come sopra, è solo un'etichetta.
        Se omessa si assume l'ultimo giorno del mese precedente.
      required: false
      example: "2026-07-31"
      selector:
        date:
    entry_id:
      name: ID configurazione
      description: >-
        Necessario solo se hai più istanze dell'integrazione configurate, per
        indicare su quale agire. Con una sola istanza lascialo vuoto.
      required: false
      selector:
        text:
